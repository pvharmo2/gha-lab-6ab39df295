name: Push components to https://components.espressif.com

on:
  workflow_run:
    workflows: ["ESP32 Arduino Release"]
    types:
      - completed

jobs:
  upload_components:
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    steps:
      - name: Get the release tag
        run: |
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "Release workflow failed. Exiting..."
            exit 1
          fi

          branch=${{ github.event.workflow_run.head_branch }}
          if [[ $branch == refs/tags/* ]]; then
            tag="${branch#refs/tags/}"
          elif [[ $branch =~ ^[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            tag=$branch
          else
            echo "Tag not found in $branch. Exiting..."
            exit 1
          fi

          echo "Tag: $tag"
          echo "RELEASE_TAG=$tag" >> $GITHUB_ENV

      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          submodules: "recursive"

      - name: Upload components to the component registry
        uses: espressif/upload-components-ci-action@40cb0e910bd57bc68661868c9557b5a77f51e473 # v1
        with:
          name: arduino-esp32
          version: ${{ env.RELEASE_TAG }}
          namespace: espressif
          api_token: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
